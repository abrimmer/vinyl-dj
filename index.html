<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setwright</title>
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Setwright">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #0e0e10; --panel: #17171a; --panel2: #1f1f23; --line: #2a2a2f; --text: #ececf0; --muted: #8b8b95;
    --accent: #c7a6ff; --warn: #ffb86b; --bad: #ff7b7b; --ok: #7ee2a8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(14,14,16,.94); backdrop-filter: blur(10px);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: .04em; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tabs button { background: none; border: 1px solid transparent; border-radius: 10px; padding: 6px 10px;
    color: var(--muted); cursor: pointer; }
  .tabs button.on { border-color: var(--line); background: var(--panel); color: var(--text); }
  input[type=search], input[type=text], input[type=number], select { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; min-width: 0; }
  input[type=search] { flex: 1 1 160px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { background: var(--panel); border: 0; padding: 8px 10px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #111; font-weight: 600; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; max-width: 1200px; margin: 0 auto;
    scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 10px;
    font-size: 13px; color: var(--muted); cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .card { background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
    display: flex; flex-direction: column; justify-content: flex-start; align-self: start; }
  .sep { grid-column: 1 / -1; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    border-bottom: 1px solid var(--line); padding: 10px 0 4px; margin-top: 4px; }
  .sep:first-child { margin-top: 0; padding-top: 0; }
  .play a.web { background: none; border: 1px solid var(--line); color: var(--muted); font-weight: 400; }
  .play a.web::before { content: ""; }
  .tabs .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 4px; vertical-align: 1px; }
  .stylebox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .stylebox .tag button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 0 0 4px; }
  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; }
  .rules label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .rules b { color: var(--text); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .st.full { background: var(--ok); } .st.part { background: var(--warn); } .st.none { background: var(--bad); }
  .play button.pv, button.pv { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700;
    border-radius: 999px; padding: 3px 10px 3px 8px; border: 0; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #FA5C70, #FA243C); }
  button.pv.on { background: #fff; color: #FA243C; }
  .carousel-nav { display: flex; gap: 8px; justify-content: flex-end; margin: -4px 0 6px; }
  @media (hover: none) { .carousel-nav { display: none; } }
  .player { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40;
    width: min(560px, 94vw); background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
    display: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .player.open { display: block; }
  .player .row1 { display: flex; gap: 10px; align-items: center; }
  .player .ttl { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player iframe { width: 100%; height: 80px; border: 0; border-radius: 10px; margin-top: 8px; }
  .player progress { width: 100%; height: 3px; margin-top: 8px; accent-color: var(--accent); }
  .carousel { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .ccard { flex: 0 0 min(78vw, 300px); scroll-snap-align: center; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .ccard img.cv, .ccard .cv { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--panel2); display: block; }
  .ccard .cb { padding: 12px; display: grid; gap: 6px; }
  .ccard .rank { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .lockbtn { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent);
    color: #111; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .lockctx { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.5; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .card img, .cover-ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block;
    background: var(--panel); }
  .card .t { margin-top: 6px; font-weight: 600; font-size: 14px; }
  .card .a, .muted { color: var(--muted); font-size: 13px; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  .btn.small { padding: 3px 8px; font-size: 12px; border-radius: 8px; }
  .icon { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; font-size: 16px; }
  .icon.on { color: var(--accent); }
  .sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; display: none;
    padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .sheet.open { display: block; }
  .sheet-top { position: sticky; top: 0; background: rgba(14,14,16,.95); backdrop-filter: blur(10px);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center; z-index: 2; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  .album-head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .album-head img { width: 160px; height: 160px; border-radius: 8px; object-fit: cover; }
  .album-head h2 { margin: 0 0 4px; font-size: 22px; }
  h3 { margin: 18px 0 8px; font-size: 16px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
  .tracks { margin-top: 16px; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
    padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .row .main { cursor: pointer; }
  .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { font-weight: 500; }
  .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .right { display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
  .bpm { min-width: 44px; text-align: right; }
  .cam { display: inline-block; min-width: 38px; text-align: center; border-radius: 6px; padding: 2px 6px;
    font-weight: 700; font-size: 13px; color: #111; }
  .cam.none { background: var(--line); color: var(--muted); }
  .links { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .links a, .links button { font-size: 12px; text-decoration: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 1px 7px; color: var(--muted); background: none; cursor: pointer; }
  .play { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .play a { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; text-decoration: none;
    border-radius: 999px; padding: 3px 10px 3px 8px; color: #fff; }
  .play a.sp { background: #1DB954; color: #000; }
  .play a.yt { background: #FF0000; }
  .play a::before { content: "▶"; font-size: 9px; }
  .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .acts button, .acts a { font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px;
    background: var(--panel); color: var(--text); cursor: pointer; text-decoration: none; }
  .acts button.hl { border-color: var(--warn); color: var(--warn); }
  .guide h3 { margin-top: 22px; } .guide p, .guide li { color: var(--muted); font-size: 14px; } .guide b { color: var(--text); }
  .guide .pill { margin: 0 4px 0 0; }
  .src { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    display: flex; gap: 12px; align-items: center; }
  .src img, .res img, .slot img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; flex: none; }
  .res { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 10px 4px;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .res:hover { background: var(--panel); }
  .pill { display: inline-block; font-size: 12px; border-radius: 999px; padding: 1px 8px; margin: 4px 6px 0 0;
    border: 1px solid var(--line); }
  .pill.pitch { border-color: var(--accent); color: var(--accent); }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .pill.bad { border-color: var(--bad); color: var(--bad); }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  .help { color: var(--muted); font-size: 13px; margin: 14px 0; }
  .help b { color: var(--text); }
  label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; margin: 12px 0; }
  .sl-card { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
  .sl-card .covers { display: flex; }
  .sl-card .covers img { width: 36px; height: 36px; border-radius: 4px; margin-right: -10px; border: 2px solid var(--panel); object-fit: cover; }
  .form { display: grid; gap: 10px; max-width: 420px; }
  .form label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
  .slot { position: relative; overflow: hidden; border-radius: 12px; }
  .slot-del { position: absolute; inset: 0; background: var(--bad); color: #111; display: flex; align-items: center;
    justify-content: flex-end; padding-right: 18px; font-weight: 700; opacity: 0; }
  .slot-inner { position: relative; display: flex; gap: 10px; align-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px; transition: transform .15s; touch-action: pan-y; }
  .slot-inner.locked { border-color: var(--accent); }
  .slot-inner.empty { background: var(--bg); border-style: dashed; color: var(--muted); cursor: pointer; justify-content: center; min-height: 56px; }
  .slot-n { width: 22px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .slot-body { flex: 1; min-width: 0; cursor: pointer; }
  .slot-body .name, .slot-body .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-acts { display: flex; flex-direction: column; align-items: center; }
  .bridge { margin: 2px 0 2px 32px; padding: 4px 0 4px 14px; border-left: 2px dotted var(--line); font-size: 12px; min-height: 10px; }
  .edit-form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0 4px; }
  .edit-form label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; z-index: 50;
    display: none; font-size: 14px; max-width: 90vw; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 16px 40px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><a href="#" id="home" style="color:inherit;text-decoration:none">Setwright</a></h1>
    <div class="tabs">
      <button data-v="records" class="on">Records</button>
      <button data-v="setlists">Setlists</button>
      <button data-v="missing">Missing</button>
      <button data-v="guide">Guide</button>
      <button data-v="sync" title="Save your edits and setlists to GitHub so every device sees them"><span class="dot" id="syncDot"></span>Sync</button>
    </div>
  </div>
  <div class="bar" style="margin-top:8px" id="filterBar">
    <input type="search" id="q" placeholder="Search artist, album, track">
    <select id="sort" aria-label="Sort">
      <option value="artist">Sort: Artist</option><option value="album">Sort: Album</option>
      <option value="added">Sort: Recently added</option><option value="year">Sort: Year (first release)</option>
      <option value="genre">Sort: Genre</option><option value="random">Sort: Random</option>
    </select>
    <div class="seg" id="range" title="Your turntable pitch range">
      <button data-r="8">±8%</button><button data-r="16">±16%</button><button data-r="24">±24%</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="view"></main>

<div class="sheet" id="sheet">
  <div class="sheet-top"><button class="btn" id="back">← Back</button><span class="muted" id="crumb" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="btn" id="home2">⌂ Records</button></div>
  <div class="wrap" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>
<div class="player" id="player"></div>

<footer>
  BPM and key data by <a href="https://getsongbpm.com" target="_blank" rel="noopener">GetSongBPM.com</a> ·
  Collection from <a href="https://www.discogs.com/user/abrimmer/collection" target="_blank" rel="noopener">Discogs</a> ·
  <span id="updated"></span> · Setwright v0.12<br>* = unsure / estimated · manual entries and setlists are saved on this device
</footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let DATA = [], TRACKS = [], BYKEY = {}, BASE = {}, VIEW = "records", STACK = [];
let RANGE = store.get("range", 8), STYLES = new Set(store.get("styles", []));
let EDITS = store.get("edits", {}), SETLISTS = store.get("setlists", []), STYLE_EDITS = store.get("styleEdits", {});
let DELETED = new Set(store.get("deletedSets", [])), FWD = [];

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 2200); }

// ---------- music helpers ----------
const num = v => { const n = parseFloat(String(v ?? "").replace("*", "")); return isNaN(n) ? null : n; };
const unsure = v => String(v ?? "").includes("*");
function cam(v) { const m = String(v ?? "").match(/(\d{1,2})([AB])/); return m ? { n: +m[1], l: m[2] } : null; }
const camStr = c => c ? c.n + c.l : "";
function camColor(c) { const h = ((c.n - 1) * 30 + 120) % 360; return `hsl(${h} ${c.l === "A" ? 60 : 75}% ${c.l === "A" ? 68 : 78}%)`; }
function camBadge(v) { const c = cam(v); return c ? `<span class="cam" style="background:${camColor(c)}">${esc(v)}</span>` : `<span class="cam none">?</span>`; }
// Pitching a record up/down also moves its key: 1 semitone = +7 on the Camelot wheel
function shiftCam(c, semis) { return c && semis ? { n: ((c.n - 1 + 7 * semis) % 12 + 12) % 12 + 1, l: c.l } : c; }
function keyRel(a, b) {
  if (!a || !b) return null;
  if (a.n === b.n && a.l === b.l) return { r: 0, t: "Same key" };
  const d = (b.n - a.n + 12) % 12;
  if (a.l === b.l && (d === 1 || d === 11)) return { r: 1, t: d === 1 ? "Key +1 (energy lift)" : "Key −1 (calmer)" };
  if (a.n === b.n) return { r: 1, t: a.l === "A" ? "Minor → major (brighter)" : "Major → minor (darker)" };
  return null;
}
function wheelDist(a, b) { if (!a || !b) return 3; const d = Math.abs(a.n - b.n) % 12; return Math.min(d, 12 - d) + (a.l === b.l ? 0 : 1); }
function tempoFit(aBpm, bBpm) {
  let best = null;
  for (const f of [1, 2, 0.5]) { const p = aBpm / (bBpm * f) - 1; if (!best || Math.abs(p) < Math.abs(best.p)) best = { p, f }; }
  return best;
}
const pct = p => Math.abs(p) < 0.0005 ? "No pitch change" : "Pitch " + (p >= 0 ? "+" : "−") + Math.abs(p * 100).toFixed(1) + "%";
// Everything about moving from track a to track b
function transition(a, b) {
  const A = num(a.bpm), B = num(b.bpm); if (!A || !B) return null;
  const fit = tempoFit(A, B), semis = Math.round(12 * Math.log2(1 + fit.p));
  const ac = cam(a.camelot), bc = cam(b.camelot), plays = shiftCam(bc, semis);
  return { fit, semis, plays, inRange: Math.abs(fit.p) <= RANGE / 100, kr: keyRel(ac, plays) };
}
function bridgeHtml(tr) {
  if (!tr) return `<span class="pill warn">No BPM data: can't work out this bridge</span>`;
  return `<span class="pill pitch">${pct(tr.fit.p)}</span>` +
    (tr.inRange ? "" : `<span class="pill bad">Outside ±${RANGE}%</span>`) +
    (tr.kr ? `<span class="pill ok">${tr.kr.t}</span>` : `<span class="pill bad">Key clash</span>`) +
    (tr.semis ? `<span class="pill warn">Plays as ${camStr(tr.plays)} (key ${tr.semis > 0 ? "up" : "down"} ${Math.abs(tr.semis)})</span>` : "") +
    (tr.fit.f === 2 ? `<span class="pill">Half-time match</span>` : tr.fit.f === 0.5 ? `<span class="pill">Double-time match</span>` : "");
}
const tkey = t => `${t.rel.id}|${t.pos}`;
function playLinks(t, withPreview = true) {
  const q = encodeURIComponent(`${t.artist || t.rel.artist} ${t.title}`);
  // spotify: links open the Spotify app directly; "web" is the fallback if the app isn't installed
  return `<div class="play">${withPreview ? pvBtn(t) : ""}<a class="sp" href="spotify:search:${q}">Spotify</a>` +
    `<a class="yt" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTube</a>` +
    `<a class="web" href="https://open.spotify.com/search/${q}" target="_blank" rel="noopener" title="Open Spotify in the browser">web</a></div>`;
}
function albumPlay(r) {
  const q = encodeURIComponent(`${r.artist} ${r.title}`.replace(/ = .*?(?= |$)/g, ""));
  return `<div class="play" style="margin-top:10px"><a class="sp" href="spotify:search:${q}">Listen on Spotify</a>` +
    `<a class="yt" href="https://www.youtube.com/results?search_query=${q}+full+album" target="_blank" rel="noopener">Listen on YouTube</a>` +
    `<a class="web" href="https://open.spotify.com/search/${q}/albums" target="_blank" rel="noopener" title="Open Spotify in the browser">web</a></div>`;
}
// ---------- previews: iTunes 30-sec clips, then Deezer, then Spotify's embedded player ----------
const PREV = {};
const loose = x => String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\p{L}\p{N}]/gu, "");
function jsonp(url, param = "callback") {
  return new Promise((res, rej) => {
    const cb = "sw_cb_" + Math.random().toString(36).slice(2), sc = document.createElement("script");
    const done = () => { clearTimeout(timer); delete window[cb]; sc.remove(); };

    <p class="help">${P || N ? `Swipe through the best fits ${P ? `after <b>${esc(P.title)}</b>` : ""}${P && N ? " and " : ""}${N ? `before <b>${esc(N.title)}</b>` : ""}, closest first

      : `<p class="help">${q ? "No tracks found." : P || N ? `Nothing fits these rules here. Loosen the setlist's tempo, key or style steps, or search.` : ""}</p>`;

function usedSets(s, skip = -1) {

// Fill empty slots between filled ones (filled slots act as fixed waypoints)

    }
    if (!next.length) break;
    next.sort((x, y) => (x.cost + x.h) - (y.cost + y.h));
    beams = next.slice(0, W);
  }
  const best = beams[0].path;
  return [...best, ...Array(steps - best.length).fill(null)];
}

const SP_REDIRECT = location.origin + location.pathname.replace(/index\.html$/, "");

async function exportSpotify(s) {
  if (!await spToken()) return spLogin(s.id);

      let id = t.spotify_id;

        const artist = (t.artist || t.rel.artist).split(" = ")[0];
        for (const title of t.title.split(" = ")) {
          const res = await spApi(`/search?type=track&limit=5&q=${encodeURIComponent(`track:"${title}" artist:"${artist}"`)}`);
          const hit = ((res.tracks || {}).items || []).find(it => it.artists.some(a => loose(a.name) && (loose(a.name).includes(loose(artist)) || loose(artist).includes(loose(a.name)))));
          if (hit) { id = hit.id; break; }

      body: JSON.stringify({ name: `${s.name} · Setwright`, public: false, description: "Made with Setwright from a vinyl collection" }) });
    for (let i = 0; i < uris.length; i += 100)

}

// ---------- guide ----------
function renderGuide() {
  const P = (cls, t) => `<span class="pill ${cls}">${t}</span>`;
  $("#view").innerHTML = `<div class="guide" style="max-width:720px">
  <h3>The one instruction: the purple %</h3>
  <p>${P("pitch", "Pitch +2.4%")} is the only tag that tells you to <b>do</b> something. Set the pitch slider on the <b>next</b> record to that value
    so its tempo matches the one playing. ${P("pitch", "No pitch change")} means leave it at 0. Everything else is information.</p>

  <h3>Key tags (do the two songs sound good together?)</h3>
  <p>Keys use the <b>Camelot wheel</b>: a number (1–12) and a letter. <b>A</b> = minor (darker), <b>B</b> = major (brighter).
    Neighbours on the wheel blend smoothly.</p>
  <ul>
    <li>${P("ok", "Same key")} Safest. Sounds seamless.</li>
    <li>${P("ok", "Key +1 (energy lift)")} One step clockwise (e.g. 8A → 9A). Feels like a small lift. Great for building a set.</li>
    <li>${P("ok", "Key −1 (calmer)")} One step back (9A → 8A). Smooth, slightly calmer.</li>
    <li>${P("ok", "Minor → major (brighter)")} / ${P("ok", "Major → minor (darker)")} Same number, other letter (8A ↔ 8B). Changes the mood, still in tune.</li>
    <li>${P("bad", "Key clash")} The keys don't sit well together. Fine for a quick cut, but it can sound off in a long blend.</li>
  </ul>

  <h3>Tempo tags</h3>
  <ul>
    <li>${P("", "Half-time match")} The next record is about half the speed (e.g. 70 vs 140 BPM). Its beats line up with every
      <b>other</b> beat of the current one. It works, but feels like the energy drops.</li>
    <li>${P("", "Double-time match")} The opposite: about twice the speed. Feels like it speeds up.</li>
    <li>${P("bad", "Outside ±8%")} You'd need more pitch than your chosen range. Switch to ±16% at the top, or pick another track.</li>
  </ul>

  <h3>Setlist rules (steps)</h3>
  <ul>
    <li><b>Tempo:</b> the most pitch change allowed between two records.</li>
    <li><b>Key steps:</b> 0 = same key only · 1 = ±1 on the wheel or minor/major swap · 2 = bolder changes · Any = ignore key.</li>
    <li><b>Style steps:</b> how far a track may move from the one before. 1 = same scene (e.g. Goth Rock → Post-Punk, Darkwave),
      2 = neighbouring scenes, 3 = anything connected. Closeness is learned from your own collection: styles that share records are close.</li>
    <li><b>Tight</b> keeps every track near your <b>first</b> track. <b>Evolve</b> lets the style change step by step over the set, and heads towards your <b>last</b> track if you set one.</li>
  </ul>

  <h3>Pitch also changes the key</h3>
  <p>On a turntable, speeding up also raises the key. Roughly <b>6% = one semitone</b>. Under about 3% nobody notices.</p>
  <ul>
    <li>${P("warn", "Plays as 4A (key up 1)")} After you set the pitch, the record will sound in this key, not its original one.
      The key tags already take this into account.</li>
  </ul>

  <h3>Data tags</h3>
  <ul>
    <li><span class="st full"></span>all tracks have BPM + key · <span class="st part"></span>some missing · <span class="st none"></span>no data yet (dot next to each record's name).</li>
    <li><b>*</b> or ${P("warn", "Data unsure *")} The BPM/key match wasn't exact, it's an estimate, or you typed it in. Check by ear.</li>
    <li><b>manual</b> You entered this yourself on this device.</li>
    <li><b>IN / OUT</b> Cue times: where to drop the needle (IN) and when to start your cut to the next record (OUT). Estimates (*) until you edit them.</li>
  </ul>

  <h3>Pitch guidance for your decks</h3>
  <ul>
    <li>Use the <b>±8%</b> range on the AT-LP120X when you can: the slider is finer, so it's easier to be accurate.</li>
    <li>To work it out yourself: <b>(BPM you want ÷ record's BPM − 1) × 100</b> = % to set. Example: 122 → 128 is about +5%.</li>
    <li>For quick cuts, being within 1–2% is fine. Cut on the first beat of a new bar.</li>
  </ul>
  </div>`;
}

const emptyUser = () => ({ edits: {}, styles: {}, setlists: [], deleted: [] });
async function ghGet() {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${UPATH}?ref=main&_=${Date.now()}`,
    { headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" }, cache: "no-store" });
  if (r.status === 404) return { data: emptyUser(), sha: null };
  if (r.status === 401 || r.status === 403) throw new Error("GitHub didn't accept the access code (it may have expired). Connect again.");

  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${UPATH}`, {
    method: "PUT", headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: "Setwright: save edits and setlists", branch: "main", content: b64enc(JSON.stringify(data, null, 1)), ...(sha ? { sha } : {}) })
  });

}
// Remote wins, except for the things this device changed since the last sync
function merge(remote) {
  const out = { edits: { ...remote.edits }, styles: { ...remote.styles }, deleted: [...new Set([...(remote.deleted || []), ...DELETED])] };
  for (const k of PENDING.edits) { if (EDITS[k]) out.edits[k] = EDITS[k]; else delete out.edits[k]; }
  for (const k of PENDING.styles) { if (STYLE_EDITS[k]) out.styles[k] = STYLE_EDITS[k]; else delete out.styles[k]; }
  const map = new Map((remote.setlists || []).map(x => [x.id, x]));
  for (const x of SETLISTS) if (PENDING.sets.includes(x.id) || !map.has(x.id)) map.set(x.id, x);
  out.setlists = [...map.values()].filter(x => !out.deleted.includes(x.id));

}

  const ids = new Set(); SETLISTS = (d.setlists || []).filter(x => !DELETED.has(x.id) && !ids.has(x.id) && ids.add(x.id));

  $("#syncBtn")?.addEventListener("click", syncNow);
  if ($("#dgBtn")) { $("#dgBtn").onclick = discogsSyncNow; discogsStatus(); }
  $("#discBtn")?.addEventListener("click", () => { TOKEN = ""; store.set("ghToken", ""); setSync("off", "Disconnected"); renderSync(); });
  $("#connBtn")?.addEventListener("click", async () => {
    const v = $("#tok").value.trim(); if (!v) return;
    TOKEN = v;
    try { await ghGet(); store.set("ghToken", v);
      // first connection: send everything on this device up, merged with what's already there
      PENDING = { edits: Object.keys(EDITS), styles: Object.keys(STYLE_EDITS), sets: SETLISTS.map(x => x.id), deleted: [...DELETED] };
      await syncNow(); toast("Connected"); }
    catch (e) { TOKEN = ""; toast(e.message); }
    renderSync();
  });
}

// ---------- sheet / nav ----------
function openSheet() { $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0; document.body.style.overflow = "hidden"; }
function closeSheet() { const n = STACK.length; STACK = []; FWD = []; $("#sheet").classList.remove("open"); document.body.style.overflow = "";
  if (n) try { history.replaceState({ d: 0 }, ""); } catch (e) {} }
function refreshSheet() { if ($("#sheet").classList.contains("open")) { const cur = STACK[STACK.length - 1]; cur && cur(); } else render(); }
// Screens stack up as you go deeper; the browser's back/forward (and [ ]) move through them.
function pushView(fn) { STACK.push(fn); FWD = []; try { history.pushState({ d: STACK.length }, ""); } catch (e) {} }
function doBack() {
  const cur = STACK.pop(); if (cur) FWD.push(cur);
  const prev = STACK[STACK.length - 1];
  if (prev) prev(); else { $("#sheet").classList.remove("open"); document.body.style.overflow = ""; render(); }
}
function doForward() { const fn = FWD.pop(); if (fn) { STACK.push(fn); fn(); } }
function back() { if (STACK.length) history.back(); }
window.addEventListener("popstate", e => {
  const d = (e.state && e.state.d) || 0;
  while (STACK.length > d) doBack();
  while (STACK.length < d && FWD.length) doForward();
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && $("#sheet").classList.contains("open") && moveCards(e.key === "ArrowRight" ? 1 : -1)) { e.preventDefault(); return; }
  if (e.key === "[") { e.preventDefault(); history.back(); }
  else if (e.key === "]") { e.preventDefault(); history.forward(); }
  else if (e.key === "l" || e.key === "L") { e.preventDefault(); goHome(); }
});
$("#back").onclick = back;
$("#q").oninput = renderGrid;
$("#sort").value = store.get("sort", "artist");
$("#sort").onchange = e => { store.set("sort", e.target.value); renderGrid(); };
function goHome(e) { e && e.preventDefault(); $("#q").value = ""; setView("records"); window.scrollTo(0, 0); }
$("#home").onclick = goHome; $("#home2").onclick = goHome;
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setView(b.dataset.v));
function setRange(r) {
  RANGE = r; store.set("range", r);
  document.querySelectorAll("#range button").forEach(b => b.classList.toggle("on", +b.dataset.r === r));
  if (DATA.length) refreshSheet();
}
document.querySelectorAll("#range button").forEach(b => b.onclick = () => setRange(+b.dataset.r));
setRange(RANGE);
load().catch(err => { $("#view").innerHTML = `<p class="help">Couldn't load the data: ${esc(err.message)}</p>`; });
</script>
</body>
