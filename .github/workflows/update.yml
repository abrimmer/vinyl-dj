name: Collection update

on:
  schedule:
    - cron: "17 * * * *"  # hourly; quiet runs (nothing new) finish in a few minutes and change nothing
  workflow_dispatch:         # "Run workflow" button for a manual update

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update data from Discogs + GetSongBPM
        id: update
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          GETSONGBPM_KEY: ${{ secrets.GETSONGBPM_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          MAX_NEW_LOOKUPS: "2500"
        run: python scripts/update.py
      - name: Save changes
        if: always()   # keep whatever was gathered, even if the update hit a problem
        run: |
          git config user.name "vinyl-dj bot"
          git config user.email "actions@users.noreply.github.com"
          # Always save on top of the latest main (works for re-runs of older runs too)
          cp data/collection.json /tmp/collection.json; cp data/last_run.txt /tmp/last_run.txt 2>/dev/null || true
          git fetch --depth=1 origin main
          git reset --hard origin/main
          cp /tmp/collection.json data/collection.json; cp /tmp/last_run.txt data/last_run.txt 2>/dev/null || true
          git add data/collection.json data/last_run.txt 2>/dev/null || git add data/collection.json
          git diff --cached --quiet || (git commit -m "Collection update" && git push origin HEAD:main)
      - name: Keep going until everything is looked up
        if: steps.update.outputs.remaining != '' && steps.update.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub often skips scheduled runs, so chain the next run ourselves.
          # Wait so we stay under GetSongBPM's 3,000 lookups per hour.
          # (only needed if this run used GetSongBPM; the fallback sources have their own pacing)
          if [ "${{ steps.update.outputs.gsb_used }}" != "0" ] || [ "${{ steps.update.outputs.paused }}" = "1" ]; then sleep 1800; fi
          gh workflow run update.yml --ref main
