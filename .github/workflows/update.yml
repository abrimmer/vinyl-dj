name: Collection update

on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours (finishes the first big load in about a day; later runs are quick)
  workflow_dispatch:         # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update data from Discogs + GetSongBPM
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          GETSONGBPM_KEY: ${{ secrets.GETSONGBPM_KEY }}
          MAX_NEW_LOOKUPS: "2800"
        run: python scripts/update.py
      - name: Save changes
        run: |
          git config user.name "vinyl-dj bot"
          git config user.email "actions@users.noreply.github.com"
          # Always save on top of the latest main (works for re-runs of older runs too)
          cp data/collection.json /tmp/collection.json
          git fetch --depth=1 origin main
          git reset --hard origin/main
          cp /tmp/collection.json data/collection.json
          git add data/collection.json
          git diff --cached --quiet || (git commit -m "Nightly collection update" && git push origin HEAD:main)
