name: Nightly collection update

on:
  schedule:
    - cron: "17 2 * * *"   # every night, about 04:17 Malta time
  workflow_dispatch:         # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update data from Discogs + GetSongBPM
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          GETSONGBPM_KEY: ${{ secrets.GETSONGBPM_KEY }}
        run: python scripts/update.py
      - name: Save changes
        run: |
          git config user.name "vinyl-dj bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/collection.json
          git diff --cached --quiet || (git commit -m "Nightly collection update" && git pull --rebase && git push)
